[project]
name = "wpt-posttrain"
version = "0.1.0"
description = "Run post-training steps on a trained model into a new model folder"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-tokenizer", "wpt-store", "wpt-model", "wpt-device", "wpt-dataset"]  # torch comes from the root group that scripts/setup.py picks

[project.scripts]
wpt-posttrain = "wpt_posttrain:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
