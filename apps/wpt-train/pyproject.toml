[project]
name = "wpt-train"
version = "0.1.0"
description = "Train a WPT model as a model recipe says, on the dataset built from it"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-tokenizer", "wpt-store", "wpt-telemetry", "wpt-model", "wpt-inference", "wpt-training", "wpt-utils", "wpt-dataset", "wpt-worker", "numpy>=2"]  # torch comes from the root group that scripts/setup.py picks

[project.scripts]
wpt-train = "wpt_train:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
