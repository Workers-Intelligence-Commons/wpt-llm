[project]
name = "wpt-chat"
version = "0.1.0"
description = "Continue text with a trained model"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-tokenizer", "wpt-model", "wpt-inference", "wpt-device"]

[project.scripts]
wpt-chat = "wpt_chat:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
