# Every check of docs/architecture.md#checks, on every push and pull request:
# scripts/check.py, the same script anyone runs before pushing.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      WPT_STORE: file:///tmp/wpt-store
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit checks read history
      - uses: astral-sh/setup-uv@v6
      - name: Install mercurial
        run: sudo apt-get update && sudo apt-get install -y mercurial
      - name: Install the workspace (CPU PyTorch; builds the Rust tokenizer)
        run: uv sync --locked --group cpu
      - name: Every check, as `uv run scripts/check.py` runs them on your machine
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            range="$base..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            base="${{ github.event.before }}"
            range="$base..${{ github.sha }}"
          else  # a new branch: every commit it holds
            base="$(git hash-object -t tree /dev/null)"
            range="${{ github.sha }}"
          fi
          uv run scripts/check.py --base "$base" --range "$range"
