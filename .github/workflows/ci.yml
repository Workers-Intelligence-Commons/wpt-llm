# Every check of docs/architecture.md#checks, on every push and pull request.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      WPT_STORE: file:///tmp/wpt-store
      # the S3 test talks to a local moto server (an S3-compatible test server)
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://127.0.0.1:9123
      AWS_DEFAULT_REGION: us-east-1
      WPT_TEST_S3_BUCKET: wpt-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit checks read history
      - uses: astral-sh/setup-uv@v6
      - name: Install mercurial
        run: sudo apt-get update && sudo apt-get install -y mercurial
      - name: Install the workspace (CPU PyTorch; builds the Rust tokenizer)
        run: uv sync --locked --group cpu
      - name: Start the S3 test server
        run: |
          uvx --from "moto[server]" moto_server -H 127.0.0.1 -p 9123 > /tmp/moto.log 2>&1 &
          for i in $(seq 30); do curl -s http://127.0.0.1:9123 > /dev/null && break; sleep 1; done
          uv run python -c "import boto3; boto3.client('s3').create_bucket(Bucket='wpt-test')"
      - name: Tests
        run: uv run pytest -rs
      - name: Rust tests
        working-directory: packages/wpt-tokenizer/rust  # inside the folder, so rustup applies rust-toolchain.toml
        run: cargo test
      - name: Data rules
        run: uv run wpt-dataset check
      - name: Changed sources and commits
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
            range="$base..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            base="${{ github.event.before }}"
            range="$base..${{ github.sha }}"
          else  # a new branch: every commit it holds
            base="$(git hash-object -t tree /dev/null)"
            range="${{ github.sha }}"
          fi
          uv run wpt-dataset check --changed "$base"
          uv run wpt-dataset check-commits "$range"
