[package]
name = "wpt-tokenizer"
# The tokenizer's version. It is part of every vocabulary's fingerprint, so
# bump it whenever a change could alter training or encoding results.
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
