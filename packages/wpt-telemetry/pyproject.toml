[project]
name = "wpt-telemetry"
version = "0.1.0"
description = "The record of one WPT command run in the store, also sent live to an OpenTelemetry backend when one is set"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-store", "wpt-utils", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
