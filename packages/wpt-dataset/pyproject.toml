[project]
name = "wpt-dataset"
version = "0.2.0"
description = "WPT's data rules: sources, manifests, cuts, patches, mixtures, builds and the checks CI runs"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "wpt-store",
    "wpt-telemetry",
    "wpt-utils",
    "wpt-tokenizer",
    "jsonschema>=4.23",
    "pyarrow>=21",
    "numpy>=2",
    "lxml>=6",
    "protego>=0.4",
]

[project.scripts]
wpt-dataset = "wpt_dataset.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
