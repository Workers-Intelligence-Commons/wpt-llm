[project]
name = "wpt-web"
version = "0.1.0"
description = "A local web interface to WPT's repository: one small server, one file per page"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-dataset", "wpt-store", "wpt-telemetry", "wpt-utils", "wpt-tokenizer", "wpt-model", "wpt-inference", "jsonschema>=4.23"]  # wpt-telemetry: the file names of a run record, for the rating page; the model packages write drafts; torch comes from the root group that scripts/setup.py picks

[project.scripts]
wpt-web = "wpt_web.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
