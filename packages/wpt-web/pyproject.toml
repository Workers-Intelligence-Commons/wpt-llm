[project]
name = "wpt-web"
version = "0.1.0"
description = "A local web interface to WPT's repository: one small server, one file per page"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["wpt-dataset", "wpt-utils"]

[project.scripts]
wpt-web = "wpt_web.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
